name = "legalvoice-api"
main = "src/index.ts"
compatibility_date = "2026-11-26"

[assets]
directory = "../../apps/web"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "legalvoice"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"

[vars]
APP_ENV = "development"
XAI_REALTIME_MODEL = "grok-voice"
